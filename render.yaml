# Blueprint do Render da HoraLimp: um serviço web (site + rotinas a cada 5 min) com disco para as fotos e
# áudios do chat, e o PostgreSQL. (Os nomes "eduvia" ficaram para não criar serviços novos no Render.)
# Depois preencha as variáveis marcadas com sync: false (painel → serviço → Environment).

services:
  - type: web
    name: eduvia
    runtime: node
    plan: standard
    region: virginia
    buildCommand: npm ci && npm run build
    # aplica as migrações do banco (a primeira da HoraLimp apaga as tabelas antigas da Eduvia)
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /termos
    disk:
      name: eduvia-arquivos
      mountPath: /var/data
      sizeGB: 5 # fotos de perfil e fotos/áudios do chat
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduvia-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # O endereço do app é detectado sozinho (RENDER_EXTERNAL_URL). Só preencha APP_URL com domínio próprio.
      - key: BETTER_AUTH_SECRET
        generateValue: true # também protege CPF e WhatsApp guardados: não troque depois de ter contas
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/uploads
      # CPF do dono: a conta de cliente criada com este CPF vira administradora
      - key: ADMIN_CPF
        sync: false
      # Pix da assinatura do profissional (SyncPay)
      - key: SYNCPAY_CLIENT_ID
        sync: false
      - key: SYNCPAY_CLIENT_SECRET
        sync: false
      # notificações push: as chaves são geradas sozinhas e guardadas no banco na primeira vez
      - key: VAPID_SUBJECT
        value: mailto:suporte@horalimp.com.br

databases:
  - name: eduvia-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
